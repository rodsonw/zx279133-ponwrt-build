name: F7615MV30 WiFi build (Linux 7.3.4)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KERNEL_TREE: ${{ github.workspace }}/linux-7.3.4
      IW_SHA: 31e2ac4ded9c8896c7aefd3dcb9a46ef77440fbd
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget cpio xz-utils

      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 -b master https://github.com/cnjn/immortalwrt.git openwrt
          git -C openwrt fetch --depth 1 origin "$IW_SHA"
          git -C openwrt checkout --detach "$IW_SHA"

      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare Linux 7.3.4 tree
        run: |
          python3 tools/prepare-sk-kernel-73.py \
            --tree "$KERNEL_TREE" --version 7.3.4 \
            --openwrt "$GITHUB_WORKSPACE/openwrt" \
            --report kernel-provenance.json

      - name: Apply 7.3 board overlays
        run: cp -a kernel-overlays-73/. "$KERNEL_TREE"/

      - name: Apply F7615MV30 PCIe/MSI/board patches
        run: |
          for p in wifi-470-pci-host.patch wifi-480-dts-pcie-msi.patch wifi-490-dts-board.patch; do
            patch -d "$KERNEL_TREE" -p1 < "$p"
          done

      - name: Add OpenWrt device profile and kernel config
        run: |
          cp wifi-openwrt-board.dts openwrt/target/linux/zte/dts/
          cp overlays-73/target/linux/zte/Makefile openwrt/target/linux/zte/Makefile
          cp overlays-73/target/linux/zte/zx279133/target.mk openwrt/target/linux/zte/zx279133/target.mk
          patch -d openwrt -p1 < wifi-image-Makefile.patch
          python3 - <<'PY'
          p = "openwrt/target/linux/zte/zx279133/config-7.3"
          s = open(p).read()
          s = s.replace("# CONFIG_PCI is not set", "CONFIG_PCI=y")
          if "CONFIG_PCI_MSI_IRQ_DOMAIN" not in s:
              s += "\nCONFIG_PCI_MSI_IRQ_DOMAIN=y\nCONFIG_PCIE_ZX279133_HOST=y\n"
          open(p, "w").write(s)
          PY

      - name: Install NPU microcode
        run: |
          mkdir -p "$KERNEL_TREE/firmware/zte/zx279133"
          cp overlays-73/target/linux/zte/zx279133/firmware/zte/zx279133/mcode_intel.bin "$KERNEL_TREE/firmware/zte/zx279133/mcode_intel.bin"
      - name: Configure
        run: |
          cp openwrt/configs/zte_zx279133_sr1010_initramfs.config openwrt/.config
          echo 'CONFIG_TARGET_zte_zx279133_DEVICE_zte_zxhn-f7615mv30=y' >> openwrt/.config
          echo '# CONFIG_TARGET_zte_zx279133_DEVICE_zte_zxslc-sr1010 is not set' >> openwrt/.config
          printf 'CONFIG_EXTERNAL_KERNEL_TREE="%s"\n' "$KERNEL_TREE" >> openwrt/.config
          rm -rf openwrt/package/network/utils/linux-atm
          echo '# CONFIG_PACKAGE_linux-atm is not set' >> openwrt/.config
          cd openwrt && make defconfig

      - name: Download packages
        working-directory: openwrt
        run: make download -j8 || make download -j1

      - name: Compile
        working-directory: openwrt
        run: make -j"$(nproc)" V=s

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: f7615mv30-wifi-images
          path: openwrt/bin/targets/zte/zx279133/*
          if-no-files-found: warn
